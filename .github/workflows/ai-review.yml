name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  models: read

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the PR (pulmo-FE)
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Check out the AI reviewer
        uses: actions/checkout@v5
        with:
          repository: IndravathiAkula/ai-code-review-poc
          ref: dev
          path: .ai-reviewer

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .ai-reviewer/requirements.txt

      - name: Install reviewer deps
        run: pip install -r .ai-reviewer/requirements.txt

      - name: Run AI review
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # If GITHUB_TOKEN above is a GitHub App installation token (for
          # a custom bot identity on comments), uncomment MODEL_API_TOKEN
          # below so the inference call uses the workflow's auto-token
          # (which carries models:read via the permissions block above).
          # MODEL_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Multi-provider support. Default is github-models; flip to
          # groq / openrouter / nvidia / etc. by setting REVIEWER_PROVIDER
          # and the matching *_API_KEY secret on this repo.
          REVIEWER_PROVIDER: github-models
          # ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}  # Claude with prompt caching (~40% cheaper on multi-chunk PRs)
          # GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          # OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          MODEL: openai/gpt-4o-mini
          MIN_CONFIDENCE: "0.6"
          MIN_SEVERITY: low
          REVIEWER_CONCURRENCY: "4"
          REVIEWER_MAX_DIFF_CHARS: "8000"
          REVIEWER_MAX_RETRIES: "3"
          REVIEWER_RETRY_BASE_SECONDS: "1.0"
          # Cost caps (0 = unlimited). Set when reviewing untrusted PRs
          # or to bound spend on monorepo-scale changes.
          REVIEWER_MAX_FILES_PER_PR: "0"
          REVIEWER_MAX_TOKENS_PER_PR: "0"
          # PRs with any of these labels exit the workflow cleanly
          # without spending tokens. Comma-separated. Set to empty
          # string to disable label-gating entirely.
          REVIEWER_SKIP_LABELS: "skip-ai-review"
          REVIEWER_POST_SUMMARY: "true"
          REVIEWER_ARTIFACT_PATH: ai-review-run.json
          REVIEWER_BLOCK_PATTERNS: ""
        run: python .ai-reviewer/scripts/review_pr.py

      - name: Upload run artifact
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ai-review-run-${{ github.event.pull_request.number }}
          path: ai-review-run.json
          if-no-files-found: ignore
